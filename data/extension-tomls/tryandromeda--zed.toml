id = "andromeda"
name = "Andromeda"
version = "0.1.0"
schema_version = 1
authors = ["Andromeda Team"]
description = "Enhanced JavaScript and TypeScript support with the Andromeda Language Server for Zed."
repository = "https://github.com/tryandromeda/zed"

[language_servers.andromeda]
name = "Andromeda Language Server"
language = "JavaScript"
languages = [
    "JavaScript",
    "JSX",
    "TypeScript",
    "TSX",
]
code_action_kinds = ["quickfix", "source.fixAll"]

[language_servers.andromeda.language_ids]
"JavaScript" = "javascript"
"JSX" = "javascriptreact"
"TypeScript" = "typescript"
"TSX" = "typescriptreact"
