id = "effect-tsgo"
name = "Effect TypeScript-Go"
description = "Zed language server extension for @effect/tsgo."
version = "0.1.0"
schema_version = 1
authors = ["Raphael Luethy <raphael@lty.gg>"]
repository = "https://github.com/Effect-TS/tsgo"

[language_servers.effect-tsgo]
name = "effect-tsgo"
languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
language_ids = { TypeScript = "typescript", TSX = "typescriptreact", JavaScript = "javascript", JSX = "javascriptreact" }

[[capabilities]]
kind = "npm:install"
package = "@effect/tsgo"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]

[[capabilities]]
kind = "process:exec"
command = "/usr/bin/xattr"
args = ["-c", "**"]
