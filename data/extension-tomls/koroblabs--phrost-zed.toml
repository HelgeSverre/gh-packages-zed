id = "phrost"
name = "phrost"
description = "PHP language support from phrost: a fast, lean language server with strict types and first-class Drupal and Laravel support."
version = "0.1.0"
schema_version = 1
authors = ["Korob Labs <opensource@koroblabs.com>"]
repository = "https://github.com/koroblabs/phrost-zed"

# PHP, and the files frameworks keep PHP-shaped knowledge in: Blade and Twig templates, and Drupal's
# YAML (services, routes, entity types). A language Zed knows only through another extension (PHP,
# Blade, Twig) is listed all the same: Zed starts the server for it once that extension is installed.
[language_servers.phrost]
name = "phrost"
languages = ["PHP", "Blade", "Twig", "YAML"]

[language_servers.phrost.language_ids]
"PHP" = "php"
"Blade" = "blade"
"Twig" = "twig"
"YAML" = "yaml"
