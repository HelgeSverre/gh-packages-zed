id = "snapcode"
name = "Snapcode"
description = "📸 Polaroid for your code — take beautiful, shareable screenshots of selected code, right from the editor."
version = "0.1.0"
schema_version = 1
authors = ["Mishal Turkane <mishalturkane@gmail.com>"]
repository = "https://github.com/mishaldotrs/snapcode"

