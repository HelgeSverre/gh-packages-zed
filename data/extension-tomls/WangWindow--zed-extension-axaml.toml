id = "axaml-avalonia"
name = "AXAML for Avalonia"
description = "AXAML support for Avalonia projects: syntax highlighting, completion, navigation through axaml-ls, plus XamlStyler formatting."
version = "0.1.0"
schema_version = 1
authors = ["WangWindow <1598593280@qq.com>"]

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
rev = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

[language_servers.axaml-ls]
name = "AXAML Language Server"
languages = ["AXAML"]

[language_servers.axaml-ls.language_ids]
AXAML = "axaml"

[language_servers.XamlStyler]
name = "XamlStyler"
languages = ["AXAML"]

[language_servers.XamlStyler.language_ids]
AXAML = "axaml"
