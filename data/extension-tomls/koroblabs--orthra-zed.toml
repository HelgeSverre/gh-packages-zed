id = "orthra-lsp"
name = "Orthra"
description = "Spell checking for prose, comments, strings and the names you declare: fast, quiet, and local."
version = "0.1.0"
schema_version = 1
authors = ["Korob Labs <opensource@koroblabs.com>"]
repository = "https://github.com/koroblabs/orthra-zed"

# Every language orthra has a host for, by Zed's name, with the language id orthra reads it as. A
# language Zed knows only through another extension (PHP, TOML) is listed all the same: Zed starts
# the server for it once that extension is installed.
[language_servers.orthra]
name = "Orthra"
languages = [
  "Plain Text",
  "Markdown",
  "Git Commit",
  "Rust",
  "TypeScript",
  "TSX",
  "Python",
  "Go",
  "PHP",
  "TOML",
  "YAML",
  "JSON",
  "JSONC",
]

[language_servers.orthra.language_ids]
"Plain Text" = "plaintext"
"Markdown" = "markdown"
"Git Commit" = "git-commit"
"Rust" = "rust"
"TypeScript" = "typescript"
"TSX" = "typescriptreact"
"Python" = "python"
"Go" = "go"
"PHP" = "php"
"TOML" = "toml"
"YAML" = "yaml"
"JSON" = "json"
"JSONC" = "jsonc"
