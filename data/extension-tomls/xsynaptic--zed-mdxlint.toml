id = "mdxlint"
name = "MDX Lint"
description = "LSP support for `mdxlint`"
version = "0.1.0"
schema_version = 1
authors = ["Alexander Synaptic <x@synapticism.com>"]
repository = "https://github.com/xsynaptic/zed-mdxlint"

# The MDX language itself comes from the separate MDX extension
[language_servers.mdxlint]
name = "mdxlint"
languages = ["MDX"]
# Matches what the server advertises; it has no refactor or source actions
code_action_kinds = ["quickfix"]
