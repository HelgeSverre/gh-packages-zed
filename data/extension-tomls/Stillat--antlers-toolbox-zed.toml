id = "statamic-antlers-toolbox"
name = "Antlers Toolbox"
description = "Statamic Antlers templates with language-server support."
version = "0.4.0"
schema_version = 1
authors = ["John Koster"]
repository = "https://github.com/Stillat/antlers-toolbox-zed"

[language_servers.antlers-language-server]
name = "Antlers Language Server"
languages = ["Antlers"]
language_ids = { "Antlers" = "antlers" }
code_action_kinds = ["", "quickfix", "refactor.rewrite"]

# Released grammar pin. scripts/stage-local-grammar.mjs replaces this block with a local
# file:// repository only when explicitly testing grammar changes.
[grammars.antlers]
repository = "https://github.com/Stillat/tree-sitter-antlers"
rev = "f9b5272cde26713f9ca4a9c1068c3066e1be7dbd"

# Non-Antlers ranges are injected into this grammar as one combined HTML document.
[grammars.html]
repository = "https://github.com/tree-sitter/tree-sitter-html"
rev = "bfa075d83c6b97cd48440b3829ab8d24a2319809"

# PHP fragments in `{{? ... ?}}` and `{{$ ... $}}` do not contain normal PHP
# opening tags, so they use tree-sitter-php's fragment-oriented entry point.
[grammars.php_only]
repository = "https://github.com/tree-sitter/tree-sitter-php"
rev = "5b5627faaa290d89eb3d01b9bf47c3bb9e797dea"
path = "php_only"
